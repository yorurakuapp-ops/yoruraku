<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>お問い合わせ｜夜ラク</title>
<style>
:root{--orange:#CC4A0E;--orange-d:#A33A08;--cream:#FFF8F0;--brown:#3A2A1F;--muted:#7B6554;--line:#EEDFCF}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--brown);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;line-height:1.85}
.box{max-width:620px;margin:0 auto;padding:36px 20px 60px}
a{color:var(--orange-d)}
h1{font-size:26px;margin:0 0 6px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px 22px;margin-top:20px}
label{display:block;font-weight:800;font-size:14.5px;margin:16px 0 6px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid #DCC7B0;border-radius:12px;background:#fff;color:var(--brown)}
textarea{min-height:150px;resize:vertical}
button{margin-top:22px;width:100%;border:0;border-radius:999px;background:var(--orange);color:#fff;font:inherit;font-weight:900;font-size:17px;padding:16px;box-shadow:0 5px 0 var(--orange-d);cursor:pointer}
button:disabled{opacity:.6}
.note{font-size:12.5px;color:var(--muted);line-height:1.8}
.ok,.ng{display:none;margin-top:16px;padding:14px;border-radius:12px;font-weight:700;font-size:14.5px}
.ok{background:#FFEBDC}.ng{background:#fff;border:1.5px solid var(--orange)}
.hp{position:absolute;left:-9999px}
</style>
</head>
<body>
<div class="box">
  <a href="../index.html">← 夜ラクに戻る</a>
  <h1 style="margin-top:14px">お問い合わせ</h1>
  <p class="note">アプリの使い方、ご契約・解約、不具合のご連絡などはこちらから。内容を確認して、メールでご返信します（通常、数日以内）。</p>
  <form class="card" id="f" novalidate>
    <label for="kind">種類</label>
    <select id="kind"><option>アプリの使い方</option><option>ご契約・お支払い・解約</option><option>不具合のご連絡</option><option>ご意見・ご要望</option><option>その他</option></select>
    <label for="name">お名前（ニックネームでOK）</label>
    <input id="name" autocomplete="name">
    <label for="mail">ご返信用のメールアドレス</label>
    <input id="mail" type="email" autocomplete="email" placeholder="example@mail.com">
    <label for="msg">お問い合わせ内容</label>
    <textarea id="msg"></textarea>
    <input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <p class="note">不具合のご連絡は、お使いの機種（iPhone／Android）と、起きたときの状況を書いていただけると助かります。</p>
    <button type="submit" id="btn">送信する</button>
    <div class="ok" id="ok">送信しました。ご連絡ありがとうございます。</div>
    <div class="ng" id="ng"></div>
  </form>
  <p class="note" style="margin-top:20px">いただいた内容は、お問い合わせへの対応のためだけに使います。詳しくは<a href="privacy.html">プライバシーポリシー</a>をご確認ください。</p>
</div>
<script>
// EmailJS（アプリの設定と同じ3つの値）。公開されても困らない値だけを入れます。
var EMAILJS = { SERVICE_ID: "service_06phmx9", TEMPLATE_ID: "template_3v7mkvf", PUBLIC_KEY: "pTLrBYXSWuWomFQXF" };
// EmailJSが未設定のときに使う、メールアプリ起動用の宛先
var FALLBACK_MAIL = "yoruraku.app@gmail.com";
var f=document.getElementById("f"),ok=document.getElementById("ok"),ng=document.getElementById("ng"),btn=document.getElementById("btn");
f.addEventListener("submit",function(e){
  e.preventDefault(); ok.style.display=ng.style.display="none";
  var v=function(i){return document.getElementById(i).value.trim()};
  if(v("hp")) return;
  if(!v("msg")||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v("mail"))){ng.textContent="メールアドレスと、お問い合わせ内容を入力してください。";ng.style.display="block";return;}
  var text="【種類】"+v("kind")+"\n【お名前】"+v("name")+"\n【返信先】"+v("mail")+"\n\n"+v("msg");
  if(!(EMAILJS.SERVICE_ID&&EMAILJS.TEMPLATE_ID&&EMAILJS.PUBLIC_KEY)){
    location.href="mailto:"+FALLBACK_MAIL+"?subject="+encodeURIComponent("【夜ラク】"+v("kind"))+"&body="+encodeURIComponent(text);return;
  }
  btn.disabled=true;
  fetch("https://api.emailjs.com/api/v1.0/email/send",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({service_id:EMAILJS.SERVICE_ID,template_id:EMAILJS.TEMPLATE_ID,user_id:EMAILJS.PUBLIC_KEY,
      template_params:{app_name:"夜ラク（お問い合わせフォーム）",message:text,from_name:v("name"),reply_to:v("mail"),kind:v("kind")}})})
  .then(function(r){if(!r.ok){return r.text().then(function(t){throw new Error(r.status+" "+t)})}ok.style.display="block";f.reset();})
  .catch(function(e){try{console.error("EmailJS",e)}catch(_){}ng.textContent="送信できませんでした。お手数ですが、時間をおいてもう一度お試しください。"+(e&&e.message?"（"+String(e.message).replace(/\s+/g," ").slice(0,160)+"）":"")+(location.protocol==="file:"?"（このファイルをパソコンで直接開いている場合は、公開したURLからお試しください）":"");ng.style.display="block";})
  .then(function(){btn.disabled=false;});
});
</script>
</body>
</html>
